<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历编辑器</title>
<style>
:root{color-scheme:light;--ink:#252a30;--mut:#737982;--line:#dce0e4;--accent:#4f70b7;--paper:#fff;--font-size:10.5pt;--leading:1.55;--margin:12mm;--section-gap:12px;--row-gap:4px}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#ebedef;font:14px/1.6 "Microsoft YaHei","Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:white;border-radius:4px;color:var(--ink);padding:6px 10px}button:hover{border-color:#8c96a3}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--accent);border-color:var(--accent);color:white}input[type=number]{width:65px}select,input[type=number]{padding:4px;border:1px solid var(--line);border-radius:4px;background:white}a{color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.app-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.app-head h1{font-size:18px;margin:0;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap}.save-note{font-size:12px;color:var(--mut);margin-left:16px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr)}aside{padding:24px 20px;background:#f8f9fa;border-right:1px solid var(--line)}aside h2{font-size:14px;margin:0 0 12px;font-weight:600}aside p,.hint{font-size:12px;color:var(--mut);margin:8px 0 16px}aside label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}aside section+section{margin-top:32px}.outline-item{display:flex;align-items:center;gap:4px;margin:8px 0}.outline-item .jump{flex:1;text-align:left;border:0;background:transparent;padding:4px 0;overflow-wrap:anywhere}.outline-item button:not(.jump){padding:2px 6px}.outline-item.off{color:var(--mut)}.sidebar-buttons{display:flex;gap:8px;flex-wrap:wrap}#notice{font-size:12px;color:#89511e;margin-top:16px;overflow-wrap:anywhere}
.workspace{padding:0 32px 40px;min-width:0;overflow:auto}.formatbar{position:sticky;top:63px;z-index:4;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 0;background:#ebedef}.formatbar .divider{width:1px;height:20px;background:#ccd1d6;margin:0 4px}.formatbar button{font-size:12px}.sheet{width:210mm;min-height:297mm;margin:8px auto 24px;padding:var(--margin);background:var(--paper);box-shadow:0 4px 20px #262c3514;color:#555;font-size:var(--font-size);line-height:var(--leading);font-family:"Microsoft YaHei","SimSun",sans-serif}.resume-header{margin-bottom:8px}.name{font-size:23pt;font-weight:700;color:#222;margin-bottom:4px}.contact,.intent{font-size:11pt;color:#333}.intent{margin-bottom:2px}.resume-section{margin-top:var(--section-gap);position:relative}.section-title{font-size:13pt;font-weight:700;line-height:1.5;color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:2px;margin-bottom:4px;break-after:avoid}.resume-row{position:relative;margin-bottom:var(--row-gap)}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:8px;color:#333;font-weight:700;break-after:avoid;break-inside:avoid}.editable{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;outline:0}.editable:empty::before{content:attr(data-placeholder);color:#a4a9b0;font-weight:400;font-size:10pt}.editable:focus{box-shadow:inset 0 0 0 1px #4f70b750;background:#f5f8ff}.selected-row{outline:1px dashed #a6b4d0;outline-offset:3px}.row-tools{display:none;position:absolute;right:-8px;top:-26px;background:#fff;box-shadow:0 2px 8px #0001;border:1px solid var(--line);padding:2px;z-index:2;white-space:nowrap}.resume-row:hover>.row-tools,.resume-row:focus-within>.row-tools{display:flex}.row-tools button{border:0;padding:1px 7px;font-size:12px}.sheet .hidden-content{display:none}.page-break{border-top:1px dashed #adb8cd;padding-top:8px}.paper-label{font-size:12px;color:var(--mut);text-align:center;margin:0}.preview .editable:empty:before{content:none}.preview .editable:focus{box-shadow:none;background:none}.preview .selected-row{outline:0}.preview .row-tools{display:none!important}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(0,1fr)}.workspace{padding:0 16px 24px}.app-head{padding:12px 16px}.save-note{display:block;margin-left:0}.formatbar{top:78px}}@media(max-width:700px){.app-head{position:static;align-items:flex-start}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:16px}aside section+section{margin-top:16px}.formatbar{position:static}#outline{display:flex;gap:12px;flex-wrap:wrap}.workspace{padding:0 12px 24px}}
@page{size:A4;margin:12mm}@media print{html,body{background:white;margin:0;padding:0}.app-head,aside,.formatbar,.paper-label,.row-tools{display:none!important}.layout,.workspace{display:block;padding:0;overflow:visible}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.editable{outline:0!important;box-shadow:none!important;background:none!important}.editable:empty::before{content:none}.selected-row{outline:0}.page-break{break-before:page;border:0;padding-top:0}.resume-row{orphans:3;widows:3}.resume-section{break-inside:auto}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.formatbar{top:0}
</style><style id="page-style"></style></head><body>
<header class="app-head"><div><h1>简历编辑器</h1><span id="save-note" class="save-note">在纸面上直接编辑</span></div><div class="actions"><button id="import">导入草稿</button><button id="backup">保存草稿</button><button id="preview">预览</button><button id="print" class="primary">导出 PDF</button></div></header>
<div class="layout"><aside>
<section><h2>页面设置</h2><label><span>显示求职意向</span><input id="show-intent" type="checkbox"></label><label><span>字号（pt）</span><input id="font-size" type="number" min="8" max="18" step="0.5"></label><label><span>行距</span><input id="line-height" type="number" min="1" max="2.5" step="0.05"></label><label><span>页边距（mm）</span><input id="margin" type="number" min="5" max="25" step="1"></label><label><span>栏目间距（px）</span><input id="section-gap" type="number" min="0" max="48"></label><label><span>文字行间距（px）</span><input id="row-gap" type="number" min="0" max="24"></label></section>
<section><h2>栏目顺序</h2><div id="outline"></div><button id="add-section">＋ 添加栏目</button><p>用 ↑ ↓ 移动整个栏目。取消勾选可隐藏，文字仍会保留。</p></section>
<section><h2>当前栏目</h2><div class="sidebar-buttons"><button id="add-text">＋ 文字行</button><button id="add-entry">＋ 经历</button><button id="delete-section">删除栏目</button></div><label><span>栏目另起一页</span><input id="page-break" type="checkbox"></label><p>点击栏目中的文字后，可添加内容。经历首行：日期左、学校／公司中、专业／岗位右。每个字块都可独立清空或删除。</p><div class="sidebar-buttons"><button id="entry-up">↑ 整条经历</button><button id="entry-down">↓ 整条经历</button><button id="delete-entry">删除经历</button></div></section>
<section><h2>保存与导出</h2><p>修改保存在当前浏览器；“保存草稿”下载可再次打开的 HTML。PDF 在打印窗口选择“另存为 PDF”，纸张选 A4，缩放 100%，关闭页眉和页脚。</p><p>手工编辑稿需自行核对措辞与事实。</p><div id="notice" role="status"></div></section>
</aside><main class="workspace"><div class="formatbar" role="toolbar" aria-label="文字格式">
<button id="undo" title="撤销（Ctrl+Z）">撤销</button><button id="redo" title="重做（Ctrl+Y）">重做</button><span class="divider"></span>
<button data-command="bold" aria-label="加粗"><b>B</b></button><button data-command="italic" aria-label="斜体"><i>I</i></button><button data-command="underline" aria-label="下划线"><u>U</u></button>
<button data-color="#555555">灰字</button><button data-color="#222222">黑字</button><button data-command="removeFormat">清除格式</button><span class="divider"></span>
<button data-align="left">左对齐</button><button data-align="center">居中</button><button data-align="right">右对齐</button><span class="divider"></span>
<button id="delete-cell">删除字块</button><button id="delete-row">删除整行</button></div>
<article id="sheet" class="sheet" aria-label="可编辑简历"></article><p class="paper-label">A4 · 空白提示和编辑控件不会出现在 PDF 中</p></main></div>
<input id="file-input" type="file" accept=".json,.html,application/json,text/html" hidden>
<script id="initial-document" type="application/json">__INITIAL_DOCUMENT__</script>
<script>
'use strict';
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const initial=JSON.parse($('initial-document').textContent),KEY='resume_editor_v1:'+initial.document_id;
let doc=clone(initial),active=null,selectionRange=null,sectionId=null,history=[],historyIndex=-1,preview=false,storageFailure=false;
const allowedTags=new Set(['B','STRONG','I','EM','U','BR','DIV','P','SPAN','FONT']);
function cleanHTML(value){
 const t=document.createElement('template');t.innerHTML=String(value);
 function scrub(parent){for(const n of [...parent.childNodes]){if(n.nodeType===3)continue;if(n.nodeType!==1){n.remove();continue;}if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','IMG','VIDEO','AUDIO'].includes(n.tagName)){n.remove();continue;}scrub(n);if(!allowedTags.has(n.tagName)){n.replaceWith(...n.childNodes);continue;}const color=n.style.color||n.getAttribute('color');for(const a of [...n.attributes])n.removeAttribute(a.name);if(['rgb(85, 85, 85)','rgb(34, 34, 34)','#555555','#222222'].includes(color))n.style.color=color;}}
 scrub(t.content);return t.innerHTML;
}
function validDocument(raw){
 if(!raw||raw.schema_version!==1||typeof raw.document_id!=='string'||!Array.isArray(raw.sections)||raw.sections.length>100)throw Error('草稿格式不正确');
 const d=clone(raw),ids=new Set();
 function id(x){if(typeof x!=='string'||!x||ids.has(x))throw Error('草稿中存在无效或重复标识');ids.add(x);}
 function cell(c){if(!c||typeof c.html!=='string'||c.html.length>500000||!['left','center','right'].includes(c.align)||typeof c.hidden!=='boolean')throw Error('文字格式不正确');c.html=cleanHTML(c.html);c.placeholder=String(c.placeholder||'文字');}
 for(const k of ['name','contact','intent'])cell(d[k]);
 if(typeof d.showIntent!=='boolean')throw Error('意向显示设置不正确');
 const ranges={fontSize:[8,18],lineHeight:[1,2.5],margin:[5,25],sectionGap:[0,48],rowGap:[0,24]};
 for(const [k,[lo,hi]] of Object.entries(ranges))if(typeof d.settings?.[k]!=='number'||!Number.isFinite(d.settings[k])||d.settings[k]<lo||d.settings[k]>hi)throw Error('页面设置超出范围');
 for(const s of d.sections){id(s.id);cell(s.title);if(typeof s.hidden!=='boolean'||typeof s.pageBreak!=='boolean'||!Array.isArray(s.rows)||s.rows.length>1000)throw Error('栏目格式不正确');for(const r of s.rows){id(r.id);if(!['text','columns'].includes(r.kind)||typeof r.hidden!=='boolean'||!Array.isArray(r.cells)||r.cells.length!==(r.kind==='text'?1:3))throw Error('文字行格式不正确');r.cells.forEach(cell);}}
 return d;
}
try{const saved=localStorage.getItem(KEY);if(saved)doc=validDocument(JSON.parse(saved));}catch(e){$('notice').textContent='本地草稿读取失败，已保留页面初始稿。可导入此前的备份。';}
function note(text){$('notice').textContent=text;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(doc));storageFailure=false;$('save-note').textContent='已保存到当前浏览器';}catch{storageFailure=true;$('save-note').textContent='本地保存失败，请保存草稿';note('浏览器存储不可用或已满；请点击“保存草稿”下载备份。');}}
function commit(){const str=JSON.stringify(doc);if(history[historyIndex]!==str){history=history.slice(0,historyIndex+1);history.push(str);if(history.length>100)history.shift();historyIndex=history.length-1;}save();historyButtons();}
function historyButtons(){$('undo').disabled=historyIndex<=0;$('redo').disabled=historyIndex>=history.length-1;}
function applySettings(){const s=doc.settings;for(const [k,v] of Object.entries({'font-size':s.fontSize+'pt',leading:s.lineHeight,margin:s.margin+'mm','section-gap':s.sectionGap+'px','row-gap':s.rowGap+'px'}))document.documentElement.style.setProperty('--'+k,v);$('page-style').textContent='@page{size:A4;margin:'+s.margin+'mm}';}
function field(c,key,cls=''){const el=document.createElement('div');el.className='editable '+cls;el.dataset.key=key;el.dataset.placeholder=c.placeholder;el.contentEditable=String(!preview);el.setAttribute('role','textbox');el.setAttribute('aria-label',c.placeholder);el.style.textAlign=c.align;el.hidden=c.hidden;el.innerHTML=cleanHTML(c.html);return el;}
function button(text,act){const b=document.createElement('button');b.textContent=text;b.addEventListener('click',act);return b;}
function render(){
 active=null;selectionRange=null;const sheet=$('sheet');sheet.replaceChildren();sheet.classList.toggle('preview',preview);applySettings();
 const head=document.createElement('header');head.className='resume-header';for(const k of ['name','intent','contact']){const el=field(doc[k],k,k);if(k==='intent'&&!doc.showIntent)el.hidden=true;head.append(el);}sheet.append(head);
 for(const s of doc.sections){if(s.hidden)continue;const sec=document.createElement('section');sec.className='resume-section'+(s.pageBreak?' page-break':'');sec.dataset.section=s.id;sec.append(field(s.title,s.id+':title','section-title'));
  for(const r of s.rows){if(r.hidden)continue;const row=document.createElement('div');row.className='resume-row '+r.kind;row.dataset.row=r.id;for(let i=0;i<r.cells.length;i++)row.append(field(r.cells[i],s.id+':'+r.id+':'+i));
   const controls=document.createElement('div');controls.className='row-tools';controls.append(button('↑',()=>moveRow(s.id,r.id,-1)),button('↓',()=>moveRow(s.id,r.id,1)),button('删行',()=>mutate(()=>s.rows.splice(s.rows.indexOf(r),1))));row.append(controls);sec.append(row);
  }sheet.append(sec);
 }
 if(!doc.sections.some(s=>s.id===sectionId&&!s.hidden))sectionId=doc.sections.find(s=>!s.hidden)?.id||null;
 renderOutline();syncControls();historyButtons();
}
function renderOutline(){const o=$('outline');o.replaceChildren();doc.sections.forEach((s,i)=>{const row=document.createElement('div');row.className='outline-item'+(s.hidden?' off':'');const c=document.createElement('input');c.type='checkbox';c.checked=!s.hidden;c.setAttribute('aria-label','显示栏目 '+plain(s.title.html));c.addEventListener('change',()=>mutate(()=>s.hidden=!c.checked));const title=button(plain(s.title.html)||'未命名栏目',()=>{sectionId=s.id;syncControls();[...$('sheet').querySelectorAll('[data-section]')].find(el=>el.dataset.section===s.id)?.scrollIntoView({block:'center'});});title.className='jump';const up=button('↑',()=>moveSection(i,-1)),down=button('↓',()=>moveSection(i,1));up.disabled=i===0;down.disabled=i===doc.sections.length-1;row.append(c,title,up,down);o.append(row);});}
function plain(v){const t=document.createElement('template');t.innerHTML=cleanHTML(v);return t.content.textContent;}
function syncControls(){$('show-intent').checked=doc.showIntent;for(const [id,k] of Object.entries({'font-size':'fontSize','line-height':'lineHeight',margin:'margin','section-gap':'sectionGap','row-gap':'rowGap'}))$(id).value=doc.settings[k];$('page-break').checked=doc.sections.find(s=>s.id===sectionId)?.pageBreak||false;for(const id of ['add-text','add-entry','delete-section','page-break'])$(id).disabled=preview||!sectionId;$('delete-cell').disabled=preview||!active;$('delete-row').disabled=preview||!active?.dataset.key.includes(':')||active?.dataset.key.endsWith(':title');for(const id of ['entry-up','entry-down','delete-entry'])$(id).disabled=preview||!entryBounds();$('preview').textContent=preview?'返回编辑':'预览';}
function getCell(key){if(['name','contact','intent'].includes(key))return doc[key];const [sid,rid,idx]=key.split(':');const s=doc.sections.find(x=>x.id===sid);return rid==='title'?s?.title:s?.rows.find(x=>x.id===rid)?.cells[Number(idx)];}
function mutate(fn){fn();commit();render();}
function moveSection(i,delta){const to=i+delta;if(to<0||to>=doc.sections.length)return;mutate(()=>{const [s]=doc.sections.splice(i,1);doc.sections.splice(to,0,s);sectionId=s.id;});}
function moveRow(sid,rid,delta){const s=doc.sections.find(s=>s.id===sid),i=s.rows.findIndex(r=>r.id===rid),to=i+delta;if(to<0||to>=s.rows.length)return;mutate(()=>{const [r]=s.rows.splice(i,1);s.rows.splice(to,0,r);});}
function entryBounds(){if(!active)return null;const [sid,rid]=active.dataset.key.split(':');const s=doc.sections.find(s=>s.id===sid);if(!s)return null;const idx=s.rows.findIndex(r=>r.id===rid);if(idx<0)return null;let start=idx;while(start>=0&&s.rows[start].kind!=='columns')start--;if(start<0)return null;let end=start+1;while(end<s.rows.length&&s.rows[end].kind!=='columns')end++;return {s,start,end};}
function moveEntry(delta){const b=entryBounds();if(!b)return;const {s,start,end}=b;let to;if(delta<0){to=start-1;while(to>=0&&s.rows[to].kind!=='columns')to--;if(to<0)return;}else{if(end>=s.rows.length)return;to=end+1;while(to<s.rows.length&&s.rows[to].kind!=='columns')to++;to-=end-start;}mutate(()=>{const rows=s.rows.splice(start,end-start);s.rows.splice(to,0,...rows);});}
function uid(){return 'id-'+crypto.randomUUID();}function newCell(placeholder,align='left'){return {html:'',align,hidden:false,placeholder};}
function textRow(){return {id:uid(),kind:'text',hidden:false,cells:[newCell('正文')]};}function entryRow(){return {id:uid(),kind:'columns',hidden:false,cells:[newCell('日期'),newCell('学校／公司','center'),newCell('专业／岗位','right')]};}
function addRows(rows){const s=doc.sections.find(s=>s.id===sectionId);if(!s)return;const rid=active?.dataset.key.split(':')[1],idx=s.rows.findIndex(r=>r.id===rid);let at=idx<0?s.rows.length:idx+1;const bounds=entryBounds();if(rows[0].kind==='columns'&&bounds?.s===s)at=bounds.end;mutate(()=>s.rows.splice(at,0,...rows));const k=s.id+':'+rows[0].id+':0';[...$('sheet').querySelectorAll('.editable')].find(e=>e.dataset.key===k)?.focus();}
function captureSelection(){const sel=getSelection();if(active&&sel.rangeCount&&active.contains(sel.anchorNode)&&active.contains(sel.focusNode))selectionRange=sel.getRangeAt(0).cloneRange();}
function restoreSelection(){if(!active||!selectionRange)return false;active.focus();const sel=getSelection();sel.removeAllRanges();sel.addRange(selectionRange);return true;}
document.addEventListener('selectionchange',captureSelection);
$('sheet').addEventListener('focusin',e=>{if(!e.target.matches('.editable'))return;active=e.target;selectionRange=null;sectionId=active.closest('[data-section]')?.dataset.section||sectionId;syncControls();});
$('sheet').addEventListener('input',e=>{if(!e.target.matches('.editable'))return;const c=getCell(e.target.dataset.key);c.html=cleanHTML(e.target.innerHTML);commit();if(e.target.classList.contains('section-title'))renderOutline();});
$('sheet').addEventListener('paste',e=>{if(!e.target.matches('.editable'))return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
document.querySelectorAll('[data-command],[data-color],[data-align]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{if(preview||!active){note('请先点击要编辑的文字，局部加粗时先选中文字。');return;}if(b.dataset.align){const c=getCell(active.dataset.key);c.align=b.dataset.align;active.style.textAlign=c.align;commit();return;}if(!restoreSelection()){note('请先选中文字，再设置格式。');return;}document.execCommand(b.dataset.command||'foreColor',false,b.dataset.color||null);getCell(active.dataset.key).html=cleanHTML(active.innerHTML);commit();captureSelection();});});
$('delete-cell').addEventListener('mousedown',e=>e.preventDefault());$('delete-cell').onclick=()=>{if(!active)return;const key=active.dataset.key;mutate(()=>getCell(key).hidden=true);note('字块已删除，可用“撤销”恢复。');};
$('delete-row').addEventListener('mousedown',e=>e.preventDefault());$('delete-row').onclick=()=>{if(!active)return;const [sid,rid]=active.dataset.key.split(':');const s=doc.sections.find(x=>x.id===sid);if(!s||rid==='title')return;mutate(()=>s.rows.splice(s.rows.findIndex(r=>r.id===rid),1));};
$('show-intent').onchange=e=>mutate(()=>doc.showIntent=e.target.checked);
for(const [id,key] of Object.entries({'font-size':'fontSize','line-height':'lineHeight',margin:'margin','section-gap':'sectionGap','row-gap':'rowGap'}))$(id).onchange=e=>{const n=Number(e.target.value);if(!Number.isFinite(n)||n<Number(e.target.min)||n>Number(e.target.max)){syncControls();note('请输入设置范围内的数值。');return;}mutate(()=>doc.settings[key]=n);};
$('page-break').onchange=e=>{const s=doc.sections.find(s=>s.id===sectionId);if(s)mutate(()=>s.pageBreak=e.target.checked);};
$('add-section').onclick=()=>{if(preview)return;const s={id:uid(),title:newCell('栏目标题'),hidden:false,pageBreak:false,rows:[entryRow(),textRow()]};mutate(()=>{doc.sections.push(s);sectionId=s.id;});[...$('sheet').querySelectorAll('[data-section]')].find(el=>el.dataset.section===s.id)?.querySelector('.editable').focus();};
$('add-text').onclick=()=>addRows([textRow()]);$('add-entry').onclick=()=>addRows([entryRow(),textRow()]);$('delete-section').onclick=()=>{if(sectionId)mutate(()=>doc.sections=doc.sections.filter(s=>s.id!==sectionId));};
$('entry-up').onclick=()=>moveEntry(-1);$('entry-down').onclick=()=>moveEntry(1);$('delete-entry').onclick=()=>{const b=entryBounds();if(b)mutate(()=>b.s.rows.splice(b.start,b.end-b.start));};
function undo(delta){const to=historyIndex+delta;if(to<0||to>=history.length)return;historyIndex=to;doc=JSON.parse(history[to]);save();render();}
$('undo').onclick=()=>undo(-1);$('redo').onclick=()=>undo(1);
document.addEventListener('keydown',e=>{if(preview)return;if((e.ctrlKey||e.metaKey)&&['z','y'].includes(e.key.toLowerCase())){e.preventDefault();undo(e.key.toLowerCase()==='y'||e.shiftKey?1:-1);}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();backup();}});
$('preview').onclick=()=>{preview=!preview;render();};$('print').onclick=()=>{note('在打印窗口选择“另存为 PDF”，A4、100% 缩放，关闭页眉和页脚。');window.print();};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function backup(){const data=clone(doc);data.origin={...data.origin,status:'manual_draft_requires_content_review'};const copy=document.documentElement.cloneNode(true);copy.querySelector('#initial-document').textContent=JSON.stringify(data).replace(/</g,'\\u003c');copy.querySelector('#sheet').replaceChildren();copy.querySelector('#outline').replaceChildren();download('简历草稿.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');note('已下载可编辑草稿；重新打开可继续编辑。');}
$('backup').onclick=backup;$('import').onclick=()=>$('file-input').click();
$('file-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('草稿文件过大');const text=await f.text();let raw;if(f.name.toLowerCase().endsWith('.html')){const data=text.match(/<script\b[^>]*\bid=["']initial-document["'][^>]*>([\s\S]*?)<\/script>/i);if(!data)throw Error('请选择本编辑器保存的 HTML 草稿');raw=JSON.parse(data[1]);}else raw=JSON.parse(text);const next=validDocument(raw);next.document_id=doc.document_id;next.origin={...next.origin,status:'manual_draft_requires_content_review'};mutate(()=>doc=next);note('草稿已导入。手工修改的内容仍需核对。');}catch(err){note('导入失败：'+err.message+'。当前稿件未改动。');}e.target.value='';};
history=[JSON.stringify(doc)];historyIndex=0;render();
</script></body></html>
